name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Vendored libraries match package-lock.json
        run: |
          npm run build:lib
          git diff --exit-code -- lib/ || (echo "lib/ is out of date: run 'npm run build:lib' and commit the result" && exit 1)
      - name: Package dry run
        run: node tools/package.mjs --version 0.0.0 --repo ${{ github.repository }}
